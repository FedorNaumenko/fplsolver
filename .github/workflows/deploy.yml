name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Without this the site builds fine but every FPL fetch 404s at runtime.
      - name: Require FPL_PROXY variable
        run: |
          if [ -z "${{ vars.FPL_PROXY }}" ]; then
            echo "::error::Set repo variable FPL_PROXY to your CORS proxy URL (Settings -> Secrets and variables -> Actions -> Variables). See worker/fpl-proxy.js"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_FPL_PROXY: ${{ vars.FPL_PROXY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
